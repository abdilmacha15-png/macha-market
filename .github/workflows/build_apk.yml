name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (Mwanzoni kabla ya kufungua ZIP)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # 4. Find Macha Market ZIP
      - name: Find Macha Market ZIP
        shell: bash
        run: |
          set -e

          echo "===== Repository files ====="
          find . -maxdepth 3 -type f | sort | head -200

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "macha_market_publish_fix.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: macha_market_publish_fix.zip not found"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 5. Unzip Macha Market
      - name: Unzip Macha Market
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== Extracted project ====="
          find extracted -maxdepth 4 -name "pubspec.yaml" -print

      # 6. Find Flutter project folder
      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find extracted \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No pubspec.yaml found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project directory: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android folder not found inside project"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Check Version Tools
      - name: Flutter version
        run: |
          flutter --version
          dart --version
          java -version

      # 8. Dependencies
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # 9. Fix Android minSdkVersion
      - name: Fix Android minSdkVersion
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "===== APPLYING MIN SDK 23 ====="

          # Groovy Gradle
          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]*flutter\.minSdkVersion/minSdkVersion 23/g' {} + || true

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]*21/minSdkVersion 23/g' {} + || true

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/g' {} + || true

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} + || true

          # Kotlin Gradle
          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/g' {} + || true

          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} + || true

          # Manifest
          find android -type f -name "AndroidManifest.xml" -exec sed -i \
            -E 's/android:minSdkVersion="21"/android:minSdkVersion="23"/g' {} + || true

      # 10. Clean & Refresh
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      # 11. Build release APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # 12. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK=$(find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "======================================"
          echo "🎉 MACHA MARKET APK SUCCESSFULLY BUILT"
          echo "======================================"

          ls -lh "$APK"

      # 13. Upload APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
