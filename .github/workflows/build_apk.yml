name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # Matches unzip path from macha_market_ui_fixed.zip
      - name: Locate project
        id: proj
        run: |
          if [ -f pubspec.yaml ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f macha_market_production/pubspec.yaml ]; then
            echo "dir=macha_market_production" >> $GITHUB_OUTPUT
          elif [ -f macha_work/macha_market_production_ready/macha_market_production/pubspec.yaml ]; then
            echo "dir=macha_work/macha_market_production_ready/macha_market_production" >> $GITHUB_OUTPUT
          else
            DIR=$(find . -name pubspec.yaml -not -path '*/\.*' | head -1 | xargs dirname)
            echo "dir=$DIR" >> $GITHUB_OUTPUT
          fi
          echo "Using: $(cat $GITHUB_OUTPUT)"

      - name: google-services.json
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          elif [ -f android/app/google-services.json ]; then
            echo "Using existing google-services.json"
          else
            echo "::warning::Missing google-services.json"
          fi

      - name: Flutter Android scaffold
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter create . --platforms=android --project-name macha_market

      - name: Dependencies
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-apk
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
