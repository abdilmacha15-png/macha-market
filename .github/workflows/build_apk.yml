name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          echo "Searching for pubspec.yaml..."

          PROJECT_DIR=""

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -maxdepth 6 -type f -name "pubspec.yaml" \
              -not -path "./.git/*" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android folder not found."
            echo "Project: $PROJECT_DIR"
            exit 1
          fi

          echo "Flutter project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Flutter project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -d android

          echo "Flutter project:"
          pwd

          echo "pubspec.yaml: OK"
          echo "android/: OK"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Ensure minSdkVersion 23
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "android/app/build.gradle" ]; then
            python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle")
text = path.read_text()

text = text.replace(
    "minSdkVersion flutter.minSdkVersion",
    "minSdkVersion 23"
)

text = text.replace(
    "minSdk flutter.minSdkVersion",
    "minSdk 23"
)

text = text.replace(
    "minSdk = flutter.minSdkVersion",
    "minSdk = 23"
)

path.write_text(text)
print("minSdkVersion updated.")
PY
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle.kts")
text = path.read_text()

text = text.replace(
    "minSdk = flutter.minSdkVersion",
    "minSdk = 23"
)

path.write_text(text)
print("minSdk updated.")
PY
          fi

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Flutter project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze || true

      - name: Clean Flutter project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Macha Market APK"
          echo "======================================"

          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          echo "Searching for APK..."

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "======================================"
          echo "Macha Market APK Build Completed"
          echo "======================================"
          echo "Flutter: 3.24.0"
          echo "Java: 17"
          echo "minSdkVersion: 23"
          echo "APK uploaded as workflow artifact."
