name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract the Flutter ZIP
      - name: Unzip Macha Market project
        run: |
          unzip -o macha_market_compile_fix.zip -d extracted

          echo "===== Extracted files ====="
          find extracted -maxdepth 3 -type f | head -100

      # 4. Automatically find pubspec.yaml
      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find extracted -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Flutter project found."
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # 6. Check Flutter
      - name: Flutter version
        run: |
          flutter --version
          flutter doctor -v

      # 7. Get dependencies
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # 8. Analyze project
      # Warnings/deprecations should NOT stop the APK build.
      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze || true

      # 9. Build APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --no-tree-shake-icons

      # 10. Verify APK exists
      - name: Verify APK
        run: |
          APK_PATH="${PROJECT_DIR}/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "===================================="
          echo "APK BUILD SUCCESSFUL"
          echo "===================================="
          ls -lh "$APK_PATH"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 12. Build summary
      - name: Build summary
        run: |
          echo "## 🎉 Macha Market APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Flutter project found" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Dependencies installed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Release APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK uploaded as workflow artifact" >> "$GITHUB_STEP_SUMMARY"
