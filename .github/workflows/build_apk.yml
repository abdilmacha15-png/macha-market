name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Macha Market project
        run: |
          unzip -o macha_market_compile_fix.zip -d extracted

          echo "===== Searching Flutter project ====="
          find extracted -name pubspec.yaml -type f

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find extracted -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # =====================================================
      # FIX FIREBASE minSdkVersion 21 -> 23
      # =====================================================

      - name: Fix Android minSdkVersion
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "===== BEFORE FIX ====="

          find android -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "AndroidManifest.xml" \) \
            -print

          echo "===== Searching minSdk ====="

          grep -R -n \
            -E "minSdkVersion|minSdk|android:minSdkVersion" \
            android || true


          echo "===== FIXING GRADLE ====="

          # Groovy Gradle
          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]*21/minSdkVersion 23/g' {} \;

          # Kotlin Gradle
          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} \;


          echo "===== FIXING ANDROID MANIFEST ====="

          # AndroidManifest.xml
          find android -type f -name "AndroidManifest.xml" -exec sed -i \
            -E 's/android:minSdkVersion="21"/android:minSdkVersion="23"/g' {} \;

          find android -type f -name "AndroidManifest.xml" -exec sed -i \
            -E "s/android:minSdkVersion='21'/android:minSdkVersion='23'/g" {} \;


          echo "===== AFTER FIX ====="

          grep -R -n \
            -E "minSdkVersion|minSdk|android:minSdkVersion" \
            android || true


      # =====================================================
      # ANALYZE
      # =====================================================

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze || true


      # =====================================================
      # CLEAN
      # =====================================================

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get


      # =====================================================
      # BUILD APK
      # =====================================================

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --no-tree-shake-icons


      # =====================================================
      # VERIFY APK
      # =====================================================

      - name: Verify APK
        run: |

          APK_PATH="${PROJECT_DIR}/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK NOT FOUND"
            exit 1
          fi

          echo "======================================"
          echo "🎉 MACHА MARKET APK SUCCESSFULLY BUILT"
          echo "======================================"

          ls -lh "$APK_PATH"


      # =====================================================
      # UPLOAD APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


      # =====================================================
      # SUMMARY
      # =====================================================

      - name: Build summary
        run: |

          echo "## 🎉 Macha Market APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Flutter project found" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Dependencies installed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Firebase minSdk fixed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK uploaded" >> "$GITHUB_STEP_SUMMARY"
