name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 MWANZONI kabla ya kutafuta mafaili ya Gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # 4. Tambua folda halisi ya mradi wa Flutter (Handling macha_market/ folder)
      - name: Locate Flutter Project Directory
        shell: bash
        run: |
          set -e

          echo "===== Searching for pubspec.yaml ====="
          PUBSPEC=$(find . -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found in repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Flutter project found at: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android folder not found inside $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Onyesha Version za Tools
      - name: Check Environment Versions
        run: |
          flutter --version
          dart --version
          java -version

      # 6. Get Flutter Dependencies
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # 7. Rekebisha minSdkVersion kuwa 23 kwa ajili ya firebase-auth
      - name: Fix Android minSdkVersion
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "===== APPLYING MIN SDK 23 ====="

          # Groovy Gradle
          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]*flutter\.minSdkVersion/minSdkVersion 23/g' {} + || true

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]*21/minSdkVersion 23/g' {} + || true

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/g' {} + || true

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} + || true

          # Kotlin Gradle
          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/g' {} + || true

          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} + || true

          # Manifest
          find android -type f -name "AndroidManifest.xml" -exec sed -i \
            -E 's/android:minSdkVersion="21"/android:minSdkVersion="23"/g' {} + || true

      # 8. Clean Project
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      # 9. Build Release APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # 10. Hakikisha APK imetengenezwa
      - name: Verify APK Generation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK=$(find build/app/outputs/flutter-apk -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK creation failed!"
            exit 1
          fi

          echo "======================================"
          echo "🎉 MACHA MARKET APK BUILT SUCCESSFULLY"
          echo "======================================"
          ls -lh "$APK"

      # 11. Upload Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
