name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 (Bila gradle cache ili isikwame kwenye ZIP)
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find and unzip Macha Market
      - name: Unzip Macha Market project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            mkdir -p extracted_macha
            unzip -o "$ZIP_FILE" -d extracted_macha

            echo "Extracted files:"
            find extracted_macha -maxdepth 3 -type f | head -100
          else
            echo "No ZIP found. Using repository directly."
          fi

      # 4. Find Flutter project
      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          FLUTTER_DIR=$(find . \
            -name pubspec.yaml \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$FLUTTER_DIR" ]; then
            echo "ERROR: No Flutter project found."
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$FLUTTER_DIR"

          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"

      # 5. Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # 6. Flutter version
      - name: Flutter version
        run: |
          flutter --version
          dart --version

      # 7. Get dependencies
      - name: Get dependencies
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter pub get

      # 8. FIX Firebase minSdk 23
      - name: Fix Android minSdkVersion
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching Android Gradle files..."

          find android -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

          # build.gradle
          if [ -f "android/app/build.gradle" ]; then
            echo "Fixing android/app/build.gradle"

            sed -i \
              -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 23/g' \
              android/app/build.gradle

            sed -i \
              -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 23/g' \
              android/app/build.gradle
          fi

          # build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Fixing android/app/build.gradle.kts"

            sed -i \
              -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 23/g' \
              android/app/build.gradle.kts

            sed -i \
              -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/g' \
              android/app/build.gradle.kts
          fi

          echo "Checking minSdk configuration..."

          grep -Rni \
            "minSdk" \
            android/app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      # 9. Clean
      - name: Flutter clean
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter clean
          flutter pub get

      # 10. Analyze - DO NOT stop build because of warnings
      - name: Analyze project
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          flutter analyze || true

      # 11. Build APK
      - name: Build release APK
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # 12. Verify APK exists
      - name: Verify APK
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          set -e

          echo "Looking for APK..."

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: |
            ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 14. Build summary
      - name: Build summary
        if: always()
        run: |
          echo "===================================="
          echo "       MACHA MARKET BUILD"
          echo "===================================="
          echo "Flutter: 3.27.0"
          echo "Java: 17"
          echo "Android minSdk: 23"
          echo "APK build process completed."
          echo "===================================="
