name: Build Macha Market APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Macha Market APK
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: "3.27.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unzip Macha Market project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "No ZIP found."
            echo "Using Flutter project already in repository."
          fi

      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          FLUTTER_DIR=$(find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "./.git/*" \
            | head -1 \
            | xargs dirname)

          if [ -z "$FLUTTER_DIR" ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          FLUTTER_DIR=$(cd "$FLUTTER_DIR" && pwd)

          echo "Flutter project found:"
          echo "$FLUTTER_DIR"

          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"

      - name: Check Flutter project
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo "Checking files..."

          test -f pubspec.yaml
          test -d android

          echo "Flutter project is valid."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      - name: Fix Android minSdkVersion
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for file in files:
              if file.exists():
                  text = file.read_text()

                  text = text.replace(
                      "flutter.minSdkVersion",
                      "23"
                  )

                  text = text.replace(
                      "minSdkVersion flutter.minSdkVersion",
                      "minSdkVersion 23"
                  )

                  text = text.replace(
                      "minSdk = flutter.minSdkVersion",
                      "minSdk = 23"
                  )

                  file.write_text(text)

                  print("Updated:", file)
          PY

      - name: Get dependencies
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter pub get

      - name: Analyze project
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

          echo "Flutter analysis completed."
          echo "Continuing to APK build..."

      - name: Flutter clean
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building Macha Market release APK..."

          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Verify APK
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "======================================"
          echo "MACHA MARKET APK BUILD"
          echo "======================================"
          echo "Build completed successfully."
          echo "APK artifact: macha-market-release-apk"
          echo "======================================"
