name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          unzip -o macha_market_final.zip -d temp_extract
          PROJECT_DIR=$(find temp_extract -name "pubspec.yaml" -exec dirname {} \;)
          cp -rn $PROJECT_DIR/* .
          rm -rf temp_extract

      - name: Fix Code Errors Automatically
        run: |
          # 1. Fix CardTheme error
          sed -i 's/CardThemeData/CardTheme/g' lib/core/theme/app_theme.dart || true

          # 2. Inject missing updateUserRole method cleanly into AuthService
          python3 -c '
          path = "lib/services/auth_service.dart"
          with open(path, "r") as f:
              content = f.read()

          method = """
            Future<void> updateUserRole(String uid, String role, {String? shopName}) async {
              try {
                await _firestore.collection("users").doc(uid).update({
                  "role": role,
                  if (shopName != null) "shopName": shopName,
                });
              } catch (e) {}
            }
          """

          if "updateUserRole" not in content:
              idx = content.rfind("}")
              if idx != -1:
                  new_content = content[:idx] + method + "\n}\n"
                  with open(path, "w") as f:
                      f.write(new_content)
          '

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
