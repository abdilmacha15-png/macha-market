name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Branded UI ZIP
        run: |
          unzip -o macha_market_branded_ui.zip -d temp_extract
          PROJECT_DIR=$(find temp_extract -name "pubspec.yaml" -exec dirname {} \;)
          cp -rn $PROJECT_DIR/* .
          rm -rf temp_extract

      - name: Inject Fixes Into Extracted Files
        run: |
          # 1. Rekebisha CardTheme
          sed -i 's/CardThemeData/CardTheme/g' lib/core/theme/app_theme.dart || true

          # 2. Ongeza minSdkVersion kuwa 23
          python3 -c '
          import re, os
          path = "android/app/build.gradle"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              content = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 23", content)
              with open(path, "w") as f:
                  f.write(content)
          ' || true

          # 3. Rekebisha au ongeza updateUserRole ndani ya auth_service.dart kwa uhakika 100%
          python3 -c '
          import os

          path = "lib/services/auth_service.dart"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              
              if "updateUserRole" not in content:
                  # Tafuta bano la mwisho la class
                  last_brace = content.rfind("}")
                  if last_brace != -1:
                      method_code = """
            Future<void> updateUserRole(String uid, String role, {String? shopName}) async {
              try {
                await FirebaseFirestore.instance.collection("users").doc(uid).update({
                  "role": role,
                  if (shopName != null) "shopName": shopName,
                });
              } catch (e) {}
            }
          """
                      new_content = content[:last_brace] + method_code + "\n}\n"
                      with open(path, "w") as f:
                          f.write(new_content)
                      print("updateUserRole added successfully!")
          ' || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
