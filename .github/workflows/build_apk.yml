name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find and unzip Macha Market project
      - name: Unzip Macha Market project
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 2 -type f | head -100

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            echo "Extracted files:"
            find extracted -maxdepth 3 -type f | head -100
          else
            echo "No ZIP file found."
          fi

      # 4. Find Flutter project
      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          FLUTTER_DIR=$(find . -name pubspec.yaml -type f \
            -not -path "./.git/*" \
            -printf '%h\n' | head -1)

          if [ -z "$FLUTTER_DIR" ]; then
            echo "ERROR: No Flutter project found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$FLUTTER_DIR"

          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"

      # 5. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # 6. Flutter version
      - name: Flutter version
        run: |
          flutter --version

      # 7. Check project
      - name: Check Flutter project
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          echo "Working directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "pubspec.yaml:"
          test -f pubspec.yaml

      # 8. Get dependencies
      - name: Get dependencies
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter pub get

      # 9. Fix Android minSdkVersion
      - name: Fix Android minSdkVersion
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then

            echo "Checking android/app/build.gradle"

            if grep -q "minSdkVersion" android/app/build.gradle; then
              sed -i 's/minSdkVersion[[:space:]]*[=:][[:space:]]*[0-9]\+/minSdkVersion 23/g' android/app/build.gradle
            fi

            if grep -q "minSdk" android/app/build.gradle; then
              sed -i 's/minSdk[[:space:]]*=[[:space:]]*[0-9]\+/minSdk = 23/g' android/app/build.gradle
            fi

            echo "Final minSdk configuration:"
            grep -n "minSdk" android/app/build.gradle || true

          fi

      # 10. Analyze project
      - name: Analyze project
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter analyze

      # 11. Clean project
      - name: Flutter clean
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter clean
          flutter pub get

      # 12. Build APK
      - name: Build release APK
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # 13. Verify APK
      - name: Verify APK
        working-directory: ${{ env.FLUTTER_DIR }}
        shell: bash
        run: |
          set -e

          echo "APK files:"
          find build/app/outputs/flutter-apk -type f -name "*.apk" -print

          APK=$(find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: |
            ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 15. Build summary
      - name: Build summary
        run: |
          echo "======================================"
          echo "       MACHA MARKET APK BUILD"
          echo "======================================"
          echo "BUILD SUCCESSFUL!"
          echo "APK uploaded as artifact."
          echo "======================================"
