name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Macha Market project
        run: |
          unzip -o macha_market_compile_fix.zip -d extracted

          echo "===== Flutter files ====="
          find extracted -name pubspec.yaml -type f

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find extracted -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Flutter project found."
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # FIX FIREBASE MIN SDK
      - name: Fix Android minimum SDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== Searching Android Gradle files ====="

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print

          echo "===== Before fix ====="
          grep -R "minSdk" android || true

          # Change minSdkVersion 21 -> 23
          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]+21/minSdkVersion 23/g' {} \;

          # Change minSdk = 21 -> 23
          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} \;

          echo "===== After fix ====="
          grep -R "minSdk" android || true

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze || true

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        run: |
          APK_PATH="${PROJECT_DIR}/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "===================================="
          echo "🎉 APK BUILD SUCCESSFUL"
          echo "===================================="

          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## 🎉 Macha Market APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Project extracted" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Flutter configured" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Firebase minSdk fixed to 23" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK uploaded" >> "$GITHUB_STEP_SUMMARY"
