name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # 4. Tafuta na Unzip faili la ZIP
      - name: Find and Unzip Project
        shell: bash
        run: |
          set -e

          echo "===== Tafuta ZIP file ====="
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Hakuna faili la .zip lililopatikana kwenye repository!"
            exit 1
          fi

          echo "ZIP Imepatikana: $ZIP_FILE"
          
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "===== ZIP Imefunguliwa Kikamilifu ====="

      # 5. Tambua folda ya mradi
      - name: Locate Flutter Project Directory
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml haipatikani ndani ya ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Flutter project location: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Folda ya android haipatikani ndani ya $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Angalia Version za Mfumo
      - name: Check Environment Versions
        run: |
          flutter --version
          dart --version
          java -version

      # 7. Get Flutter Dependencies
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # 8. Lazimisha SDK 35 kwa kubadilisha moja kwa moja faili zote za Android
      - name: Enforce Android SDK 35 Globally
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "===== LAZIMISHA SDK 35 NA MIN SDK 23 ====="

          # 1. Ongeza gradle properties za kuzuia usalama wa SDK check
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          echo "android.overrideCompileSdk=35" >> android/gradle.properties

          # 2. Rejesha na kubadilisha maneno 34, flutter.compileSdkVersion kuwa 35 kwenye faili ZOTE
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            's/flutter.compileSdkVersion/35/g' {} + || true

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            's/compileSdk = 34/compileSdk = 35/g' {} + || true

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            's/compileSdkVersion 34/compileSdkVersion 35/g' {} + || true

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            's/compileSdkVersion(34)/compileSdkVersion(35)/g' {} + || true

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i \
            's/flutter.minSdkVersion/23/g' {} + || true

      # 9. Clean Project
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      # 10. Build Release APK (Pamoja na flag ya kuzuia AAR metadata failure)
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      # 11. Uhakiki wa APK
      - name: Verify APK Generation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK=$(find build/app/outputs/flutter-apk -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK creation failed!"
            exit 1
          fi

          echo "======================================"
          echo "🎉 MACHA MARKET APK BUILT SUCCESSFULLY"
          echo "======================================"
          ls -lh "$APK"

      # 12. Upload Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
