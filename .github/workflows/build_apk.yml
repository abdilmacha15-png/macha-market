name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Macha Market APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find and extract the Flutter project
      - name: Unzip Macha Market project
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 3 -type f | head -100

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "*.zip" -o -name "macha_market_complete.zip" \) \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted files:"
          find extracted_project -maxdepth 4 -type f | head -150

      # 4. Find pubspec.yaml
      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -name "pubspec.yaml" \
            -type f \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Verify Flutter project
      - name: Check Flutter project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Flutter files:"
          ls -la

          test -f pubspec.yaml
          test -d android

      # 6. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # 7. Flutter version
      - name: Flutter version
        run: |
          flutter --version

      # 8. Fix Android minSdk
      - name: Fix Android minSdkVersion
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for path in candidates:
              if not path.exists():
                  continue

              text = path.read_text()

              replacements = [
                  ("minSdkVersion flutter.minSdkVersion",
                   "minSdkVersion 23"),
                  ("minSdk = flutter.minSdkVersion",
                   "minSdk = 23"),
                  ("minSdkVersion flutter.compileSdkVersion",
                   "minSdkVersion 23"),
              ]

              for old, new in replacements:
                  text = text.replace(old, new)

              path.write_text(text)
              print(f"Updated: {path}")
              found = True

          if not found:
              print("WARNING: Android build.gradle file was not found.")
          PY

      # 9. Get dependencies
      - name: Get dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get

      # 10. Analyze without failing on info/warnings
      - name: Analyze project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # 11. Clean
      - name: Flutter clean
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      # 12. Build APK
      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --no-tree-shake-icons

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 15. Build summary
      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "Macha Market APK BUILD SUCCESSFUL"
          echo "======================================"

          find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;       
