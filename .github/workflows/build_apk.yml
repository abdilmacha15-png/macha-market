name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Recreate Android project files & Fix Settings
        run: |
          flutter create . --platforms=android --org=com.machamarket.macha_market
          mkdir -p assets/images assets/icons
          sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdk = 23/' android/app/build.gradle
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-apk
          path: build/app/outputs/flutter-apk/app-release.apk
