name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          unzip -o macha_market_final.zip -d temp_extract
          PROJECT_DIR=$(find temp_extract -name "pubspec.yaml" -exec dirname {} \;)
          cp -rn $PROJECT_DIR/* .
          rm -rf temp_extract

      - name: Inject Fixes Into Extracted Files
        run: |
          # 1. Rekebisha CardTheme
          sed -i 's/CardThemeData/CardTheme/g' lib/core/theme/app_theme.dart || true

          # 2. Ongeza minSdkVersion kuwa 23 kwa ajili ya Firebase Auth
          python3 -c '
          import re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          content = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 23", content)
          with open(path, "w") as f:
              f.write(content)
          '

          # 3. Ongeza updateUserRole kwenye auth_service.dart
          cat << 'EOF' > fix_script.py
          path = "lib/services/auth_service.dart"
          with open(path, "r") as f:
              lines = f.readlines()

          method = """
            Future<void> updateUserRole(String uid, String role, {String? shopName}) async {
              try {
                await FirebaseFirestore.instance.collection("users").doc(uid).update({
                  "role": role,
                  if (shopName != null) "shopName": shopName,
                });
              } catch (e) {}
            }
          """

          for i in range(len(lines) - 1, -1, -1):
              if "}" in lines[i]:
                  lines.insert(i, method)
                  break

          with open(path, "w") as f:
              f.writelines(lines)
          EOF
          python3 fix_script.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
