name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # UNZIP THE NEW PROJECT
      - name: Unzip Macha Market
        shell: bash
        run: |
          set -e

          ZIP_FILE="macha_market_storage_fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED PROJECT ====="
          find extracted -maxdepth 3 -name "pubspec.yaml" -print

      # FIND pubspec.yaml
      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find extracted \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No Flutter project found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # FLUTTER
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # DEPENDENCIES
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # FIX FIREBASE MIN SDK
      - name: Fix Android minSdkVersion
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "===== BEFORE ====="
          grep -R -n -E \
            "minSdkVersion|minSdk|flutter.minSdkVersion" \
            android || true

          # Groovy Gradle
          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]*flutter\.minSdkVersion/minSdkVersion 23/g' {} \;

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdkVersion[[:space:]]*21/minSdkVersion 23/g' {} \;

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/g' {} \;

          find android -type f -name "*.gradle" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} \;

          # Kotlin Gradle
          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/g' {} \;

          find android -type f -name "*.gradle.kts" -exec sed -i \
            -E 's/minSdk[[:space:]]*=[[:space:]]*21/minSdk = 23/g' {} \;

          # Manifest
          find android -type f -name "AndroidManifest.xml" -exec sed -i \
            -E 's/android:minSdkVersion="21"/android:minSdkVersion="23"/g' {} \;

          echo "===== AFTER ====="
          grep -R -n -E \
            "minSdkVersion|minSdk|flutter.minSdkVersion" \
            android || true

      # CLEAN
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      # ANALYZE
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze || true

      # BUILD APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # CHECK APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          APK=$(find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"
          ls -lh "$APK"

      # UPLOAD APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
