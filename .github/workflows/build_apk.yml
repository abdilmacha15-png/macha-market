name: Build Macha Market APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------
      # 1. Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Locate Flutter project BEFORE doing Gradle operations
      # ----------------------------------------------------------
      - name: Locate Flutter project
        id: locate
        shell: bash
        run: |
          set -e

          echo "Searching for pubspec.yaml..."

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          elif [ -f "macha_market/pubspec.yaml" ]; then
            PROJECT_DIR="macha_market"
          else
            PROJECT_DIR=$(find . \
              -maxdepth 5 \
              -type f \
              -name "pubspec.yaml" \
              -not -path "./.git/*" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            echo "Repository structure:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory not found."
            echo "Project directory: $PROJECT_DIR"
            exit 1
          fi

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # 3. Verify project structure
      # ----------------------------------------------------------
      - name: Verify Flutter project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Flutter project"
          echo "======================================"

          pwd

          echo ""
          echo "pubspec.yaml:"
          test -f pubspec.yaml
          echo "OK"

          echo ""
          echo "android/:"
          test -d android
          echo "OK"

          echo ""
          echo "Gradle files:"
          find android \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print

      # ----------------------------------------------------------
      # 4. Java 17
      #
      # IMPORTANT:
      # No cache: gradle here.
      # This prevents the previous "No file matched" error.
      # ----------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------------------------
      # 5. Flutter
      # ----------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      # ----------------------------------------------------------
      # 6. Show versions
      # ----------------------------------------------------------
      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      # ----------------------------------------------------------
      # 7. Fix Firebase minimum SDK
      # ----------------------------------------------------------
      - name: Ensure Android minSdkVersion is 23
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "android/app/build.gradle" ]; then
            python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle")
text = path.read_text()

text = text.replace(
    "minSdkVersion flutter.minSdkVersion",
    "minSdkVersion 23"
)

text = text.replace(
    "minSdk flutter.minSdkVersion",
    "minSdk 23"
)

text = text.replace(
    "minSdk = flutter.minSdkVersion",
    "minSdk = 23"
)

path.write_text(text)
print("Updated android/app/build.gradle")
PY
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle.kts")
text = path.read_text()

text = text.replace(
    "minSdk = flutter.minSdkVersion",
    "minSdk = 23"
)

path.write_text(text)
print("Updated android/app/build.gradle.kts")
PY
          fi

          echo ""
          echo "Current minSdk configuration:"
          grep -Rni "minSdk" android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      # ----------------------------------------------------------
      # 8. Flutter dependencies
      # ----------------------------------------------------------
      - name: Flutter pub get
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

      # ----------------------------------------------------------
      # 9. Analyze
      #
      # Analyzer warnings must not prevent APK build.
      # ----------------------------------------------------------
      - name: Flutter analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          flutter analyze || {
            STATUS=$?

            echo "Flutter analyze returned: $STATUS"
            echo "Continuing to release build..."
          }

      # ----------------------------------------------------------
      # 10. Clean
      # ----------------------------------------------------------
      - name: Flutter clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      # ----------------------------------------------------------
      # 11. Build release APK
      # ----------------------------------------------------------
      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Macha Market APK"
          echo "======================================"

          flutter build apk \
            --release \
            --no-tree-shake-icons

      # ----------------------------------------------------------
      # 12. Verify APK
      # ----------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          echo "Searching for APK..."

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # ----------------------------------------------------------
      # 13. Upload APK
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macha-market-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------
      # 14. Summary
      # ----------------------------------------------------------
      - name: Build summary
        run: |
          echo "======================================"
          echo "       MACHA MARKET BUILD"
          echo "======================================"
          echo "Flutter: 3.24.0"
          echo "Java: 17"
          echo "minSdkVersion: 23"
          echo ""
          echo "RELEASE APK BUILD COMPLETED."
          echo "======================================"
